[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-cv-assurance"
version = "0.1.0"
description = "Offline computer-vision integrity assurance prototype for SIH 26228"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Proprietary - SIH prototype"}
dependencies = [
  "cleanlab==2.6.6",
  "ImageHash==4.3.1",
  "jsonschema==4.21.1",
  "numpy==1.26.4",
  "Pillow==10.2.0",
  "PyYAML==6.0.1",
  "scikit-learn==1.3.2",
  "scipy==1.11.4",
  "torch==2.2.1",
  "torchvision==0.17.1",
]

[project.scripts]
sentinel = "sentinel.pipeline:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

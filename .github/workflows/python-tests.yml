name: VisiOps CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt
        pip install -e .
    - name: Run Tests
      run: |
        pytest tests/ > pytest_output.txt 2>&1 || true
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add pytest_output.txt
        if grep -q "failed" pytest_output.txt || grep -q "error" pytest_output.txt; then
          git commit -m "chore: save pytest output (FAILURE)"
          git push
          exit 1
        else
          git commit -m "chore: save pytest output (SUCCESS)"
          git push
          exit 0
        fi

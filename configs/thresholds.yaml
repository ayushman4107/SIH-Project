detectors:
  review_threshold: 0.70
  quarantine_threshold: 0.95
  phash_hamming_threshold: 8
  cosine_threshold: 0.95
  cosine_neighbors: 10
  outlier_percentile: 0.95
  source_p_value: 0.01
  source_rate_multiplier: 2.0
  entropy_low_ratio: 0.7
  entropy_high_ratio: 1.3
  # F1 acceptance gates
  f1_label_flip_recall_floor: 0.60
  f1_duplicate_precision_floor: 0.80
  f1_outlier_auc_floor: 0.70
  # F2 configuration
  f2_threshold_mode: "nextafter"
  f2_regularized_k: 2.0
  f2_min_references: 2
  # F3 acceptance gates
  f3_tamper_detection_rate: 1.0
  f3_replay_detection_rate: 1.0
  f3_mutation_detection_rate: 1.0

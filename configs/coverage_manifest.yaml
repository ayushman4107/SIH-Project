implemented_checks:
  - cleanlab_label_quality
  - phash_duplicate_detection
  - embedding_cosine_duplicates
  - isolation_forest_outliers
  - source_concentration
  - weight_spectral_analysis
  - inference_hmac_binding
  - authenticated_audit_chain
  - mahalanobis_ood
  - predictive_entropy_ratio
  - ood_cifar100_secondary
unsupported_attack_classes:
  - trigger_discovery
  - black_box_fingerprinting
  - bounding_box_tampering
  - architectural_backdoors
  - model_laundering_or_distillation
  - adversarial_patches
  - semantic_cause_attribution
  - blended_or_physical_triggers
  - federated_poisoning
  - hardware_compromise
  - cross_session_replay
  - host_compromise
  - tail_truncation_without_expected_length
trigger_scope:
  tested_triggers:
    - type: "patch_checkerboard"
      size: "3x3"
      position: "bottom_right"
      target_class: 0
      channels: "all_rgb"
  untested_trigger_families:
    - "blended_triggers"
    - "warped_triggers_wanet"
    - "randomized_position_triggers"
    - "randomized_size_triggers"
    - "clean_label_attacks"
    - "input_aware_triggers"
  disclosure: >
    Detection rates are measured against a single fixed-patch BadNets trigger.
    Results do not generalize to blended, warped, or adaptive backdoor triggers.
    This is scoped as a v1 proof-of-concept benchmark.
